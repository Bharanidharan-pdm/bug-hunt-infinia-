<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register Team — BUG HUNT</title><link rel="stylesheet" href="/css/style.css"><script src="https://unpkg.com/lucide@latest"></script></head>
<body><div class="bg-grid"></div>
<nav class="topnav"><div class="wrap"><a class="brand" href="/"><span class="logo"><i data-lucide="bug" style="color:#fff"></i></span><span>BUG HUNT<small>DEBUG COMPETITION</small></span></a>
<div class="navlinks"><a href="/login.html">Team Login</a><a href="/rules.html">Rules</a></div></div></nav>
<div class="wrap"><div class="card form-card">
<h2 style="margin:0">Register Your Team</h2><p class="mut small">Exactly <b>2 members</b> → <b>1 shared login</b> → <b>1 shared score</b>.<br>Team login needs an <b>@sasurie.com</b> address · each mobile number can register only once.</p>
<label>Team Name *</label><input id="team_name" placeholder="Code Warriors">
<div class="two">
<div class="card" style="margin-top:14px"><h3>Member 1 *</h3>
<label>Full Name</label><input id="m1_name"><label>Email</label><input id="m1_email"><label>Phone</label><input id="m1_phone">
<label>College</label><input id="m1_college"><div class="two"><div><label>Department</label><input id="m1_dept"></div><div><label>Year</label><input id="m1_year" placeholder="e.g. 2"></div></div></div>
<div class="card" style="margin-top:14px"><h3>Member 2 *</h3>
<label>Full Name</label><input id="m2_name"><label>Email</label><input id="m2_email"><label>Phone</label><input id="m2_phone">
<label>College</label><input id="m2_college"><div class="two"><div><label>Department</label><input id="m2_dept"></div><div><label>Year</label><input id="m2_year" placeholder="e.g. 2"></div></div></div>
</div>
<div class="card" style="margin-top:14px"><h3>One Common Team Login *</h3><p class="mut small">Both members share these credentials.</p>
<label>Team Login Email / Team ID (@sasurie.com only) *</label><input id="login_email" placeholder="codewarriors@sasurie.com">
<div class="two"><div><label>Password (min 6)</label><input id="pw" type="password"></div><div><label>Confirm Password</label><input id="pw2" type="password"></div></div></div>
<div id="err" class="small" style="color:#fca5a5;margin-top:10px"></div>
<button class="btn pri" id="go" style="width:100%;justify-content:center;margin-top:16px"><i data-lucide="user-plus"></i> Register Team</button>
</div></div>
<script src="/js/common.js"></script>
<script>
icons();
$('#go').onclick = async () => {
  $('#err').textContent = '';
  const v = (id) => document.getElementById(id).value;
  const body = { team_name: v('team_name'), login_email: v('login_email'), password: v('pw'), confirm_password: v('pw2'),
    member1: { full_name: v('m1_name'), email: v('m1_email'), phone: v('m1_phone'), college: v('m1_college'), department: v('m1_dept'), year: v('m1_year') },
    member2: { full_name: v('m2_name'), email: v('m2_email'), phone: v('m2_phone'), college: v('m2_college'), department: v('m2_dept'), year: v('m2_year') } };
  try { await api('/api/auth/register', { method: 'POST', body: JSON.stringify(body) }); toast('Team registered! Please login.', 'ok'); setTimeout(() => location.href = '/login.html', 900); }
  catch (e) { $('#err').textContent = e.message; }
};
</script></body></html>
